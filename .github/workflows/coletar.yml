name: Validar DATASUS SIH v2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cli.py importar-procedimentos
      - run: python -m pytest tests/ -q
      - run: python cli.py diagnostico
