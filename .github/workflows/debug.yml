name: Debug FTP DATASUS
on:
  workflow_dispatch:
    inputs:
      uf:
        required: true
      ano:
        required: true
      mes:
        required: true
      codigo:
        required: true
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnosticar codigo especifico no SP bruto
        env:
          DBG_UF: ${{ inputs.uf }}
          DBG_ANO: ${{ inputs.ano }}
          DBG_MES: ${{ inputs.mes }}
          DBG_CODIGO: ${{ inputs.codigo }}
        run: |
          python -c "
          import os
          from datasus.download import _baixar_via_ftp_direto
          from datasus import codigos
          uf = os.environ['DBG_UF']
          ano = int(os.environ['DBG_ANO'])
          mes = int(os.environ['DBG_MES'])
          codigo = os.environ['DBG_CODIGO']
          r = _baixar_via_ftp_direto(uf, ano, mes, grupo='SP')
          df = r.bruto
          print('total_bruto', r.total_bruto)
          print('colunas', list(df.columns))
          df['cod_norm'] = df['PROC_REA'].apply(lambda v: codigos.normalizar_codigo(v, 10))
          sub = df[df['cod_norm'] == codigo]
          print('linhas brutas com esse codigo:', len(sub))
          print('AIH distintas com esse codigo:', sub['N_AIH'].astype(str).nunique())
          "
